<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-labelledby="title"><title id="title">Display connections</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d83"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#27323b;font-size:16px}.small{font-size:13px;fill:#52616b}.head{font-size:20px;font-weight:600}.box{fill:#f4f7f9;stroke:#97a9b5;stroke-width:1.5}.signal{stroke:#285d83;stroke-width:2;fill:none;marker-end:url(#arrow)}.wire{stroke:#455764;stroke-width:2;fill:none}.power{stroke:#a35e2f;stroke-width:3;fill:none}.thermal{fill:#f7e6d8;stroke:#b87a4d}.cool{fill:#dceaf5;stroke:#5d8cae}</style><rect width="100%" height="100%" fill="#fff"/><text x="24" y="32" class="head">Display connections</text><rect x="28" y="90" width="220" height="100" rx="5" class="box"/><text x="42" y="117">Display ESP32</text><text x="42" y="140" class="small">GPIO table in wiring guide</text><text x="42" y="163" class="small">ESP-NOW from master</text><path d="M248 135 H328" class="signal"/><rect x="336" y="90" width="238" height="100" rx="5" class="box"/><text x="350" y="117">Logic-level interface</text><text x="350" y="140" class="small">RGB, address, CLK, LAT, OE</text><text x="350" y="163" class="small">Use if required by panel</text><path d="M574 135 H647" class="signal"/><rect x="655" y="85" width="254" height="112" rx="5" class="box"/><text x="669" y="112">Panel 1 IN → OUT → Panel 2</text><text x="669" y="135" class="small">Continue through 8 panels</text><text x="669" y="158" class="small">Physical chain: 8 × 64 × 32</text><rect x="655" y="259" width="254" height="62" rx="5" class="box"/><text x="669" y="286">Rated panel power supply</text><path d="M785 259 V197" class="power"/><text x="548" y="237" class="small">Power leads</text><path d="M135 190 V353 H784 V321" class="wire"/><path d="M455 190 V353" class="wire"/><text x="190" y="345" class="small">Common signal-ground reference</text><text x="24" y="389" class="small">Power the ESP32 through its specified board input. Do not carry panel current through GPIOs.</text></svg>
