   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243846" x="128.16" y="257.768516">Experiment ESP32</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(67.458906 270.086109)">trial sequence + PWM</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(327.016969 250.12475)">4 × H-bridge drivers</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(344.054078 262.442344)">RPWM · LPWM</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(350.373922 274.759937)">R_EN · L_EN</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(554.788781 257.768516)">4 × Peltier targets</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(547.552844 270.086109)">one output pair each</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243846" x="383.184" y="156.035312" transform="rotate(-0 383.184 156.035312)">Load supply + fuses</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #216b8c" x="254.016" y="252.6336" transform="rotate(-0 254.016 252.6336)">GPIO</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b75337" x="383.184" y="191.8944" transform="rotate(-0 383.184 191.8944)">load power</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #62727c" x="254.016" y="360.792" transform="rotate(-0 254.016 360.792)">Common logic ground</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243846" x="42.048" y="398.088" transform="rotate(-0 42.048 398.088)">Load current returns to the power supply. It must not pass through the ESP32 or signal tracks.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(518.976 138.596375)">Both Peltier leads</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(518.976 149.794187)">go to driver outputs.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243846" transform="translate(518.976 160.992)">Neither lead is GPIO.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243846" x="42.048" y="105.048" transform="rotate(-0 42.048 105.048)">Driver logic VCC must also use its specified supply and ESP32-compatible signal levels.</text>
   </g>
  </g>
