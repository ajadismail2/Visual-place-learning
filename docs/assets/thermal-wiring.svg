<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 535" role="img" aria-labelledby="title"><title id="title">Thermal controllers: proposed ESP32 conversion</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d83"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#27323b;font-size:16px}.small{font-size:13px;fill:#52616b}.head{font-size:20px;font-weight:600}.box{fill:#f4f7f9;stroke:#97a9b5;stroke-width:1.5}.signal{stroke:#285d83;stroke-width:2;fill:none;marker-end:url(#arrow)}.wire{stroke:#455764;stroke-width:2;fill:none}.power{stroke:#a35e2f;stroke-width:3;fill:none}.thermal{fill:#f7e6d8;stroke:#b87a4d}.cool{fill:#dceaf5;stroke:#5d8cae}</style><rect width="100%" height="100%" fill="#fff"/><text x="24" y="32" class="head">Thermal controllers: proposed ESP32 conversion</text><rect x="24" y="80" width="200" height="100" rx="5" class="box"/><text x="38" y="107">TMP117</text><text x="38" y="130" class="small">Controlled surface</text><text x="38" y="153" class="small">Compatible logic supply</text><rect x="280" y="80" width="210" height="100" rx="5" class="box"/><text x="294" y="107">Background ESP32</text><text x="294" y="130" class="small">SDA 21 / SCL 22</text><text x="294" y="153" class="small">PWM 25</text><rect x="548" y="80" width="180" height="100" rx="5" class="box"/><text x="562" y="107">Power stage</text><text x="562" y="130" class="small">Logic-compatible input</text><rect x="786" y="80" width="168" height="100" rx="5" class="box"/><text x="800" y="107">60 Peltiers</text><text x="800" y="130" class="small">Series background</text><path d="M224 130 H272 M490 130 H540 M728 130 H778" class="signal"/><path d="M860 180 V226 H120 V180" fill="none" stroke="#8c9ba5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="290" y="221" class="small">Temperature feedback from the controlled location</text><rect x="24" y="295" width="200" height="100" rx="5" class="box"/><text x="38" y="322">OneWire sensor</text><text x="38" y="345" class="small">Ring temperature</text><text x="38" y="368" class="small">Confirm model + pull-up</text><rect x="280" y="295" width="210" height="100" rx="5" class="box"/><text x="294" y="322">Ring ESP32</text><text x="294" y="345" class="small">Sensor data GPIO 4</text><text x="294" y="368" class="small">PWM 25</text><rect x="548" y="295" width="180" height="100" rx="5" class="box"/><text x="562" y="322">MOSFET stage</text><text x="562" y="345" class="small">Logic-compatible input</text><rect x="786" y="295" width="168" height="100" rx="5" class="box"/><text x="800" y="322">Ring heater</text><text x="800" y="345" class="small">Rated supply</text><path d="M224 345 H272 M490 345 H540 M728 345 H778" class="signal"/><path d="M860 395 V441 H120 V395" fill="none" stroke="#8c9ba5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="290" y="436" class="small">Temperature feedback from the controlled location</text><text x="24" y="496" class="small">Separate boards. External supplies power the loads through their power stages.</text><text x="24" y="519" class="small">Share each circuit's logic ground. Arduino pin 9 must be remapped; ESP32 firmware conversion is pending.</text></svg>
