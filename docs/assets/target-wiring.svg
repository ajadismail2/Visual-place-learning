<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" role="img" aria-labelledby="title"><title id="title">Four target connections</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d83"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#27323b;font-size:16px}.small{font-size:13px;fill:#52616b}.head{font-size:20px;font-weight:600}.box{fill:#f4f7f9;stroke:#97a9b5;stroke-width:1.5}.signal{stroke:#285d83;stroke-width:2;fill:none;marker-end:url(#arrow)}.wire{stroke:#455764;stroke-width:2;fill:none}.power{stroke:#a35e2f;stroke-width:3;fill:none}.thermal{fill:#f7e6d8;stroke:#b87a4d}.cool{fill:#dceaf5;stroke:#5d8cae}</style><rect width="100%" height="100%" fill="#fff"/><text x="24" y="32" class="head">Four target connections</text><rect x="24" y="62" width="290" height="425" rx="5" class="box"/><text x="38" y="89">Target ESP32</text><text x="38" y="112" class="small">GPIO values from supplied controller</text><text x="42" y="135">A: RPWM 27 / LPWM 14</text><text x="42" y="158" class="small">R_EN 23 / L_EN 22</text><path d="M314 142 H403" class="signal"/><rect x="410" y="111" width="226" height="68" rx="5" class="box"/><text x="424" y="138">Driver 3</text><text x="424" y="161" class="small">Separate target A output</text><path d="M636 135 H762 M636 147 H762" class="wire"/><rect x="770" y="115" width="142" height="60" rx="5" class="box"/><text x="784" y="142">Peltier A</text><text x="42" y="225">B: RPWM 25 / LPWM 26</text><text x="42" y="248" class="small">R_EN 13 / L_EN 15</text><path d="M314 232 H403" class="signal"/><rect x="410" y="201" width="226" height="68" rx="5" class="box"/><text x="424" y="228">Driver 2</text><text x="424" y="251" class="small">Separate target B output</text><path d="M636 225 H762 M636 237 H762" class="wire"/><rect x="770" y="205" width="142" height="60" rx="5" class="box"/><text x="784" y="232">Peltier B</text><text x="42" y="315">C: RPWM 19 / LPWM 18</text><text x="42" y="338" class="small">R_EN 2 / L_EN 16</text><path d="M314 322 H403" class="signal"/><rect x="410" y="291" width="226" height="68" rx="5" class="box"/><text x="424" y="318">Driver 4</text><text x="424" y="341" class="small">Separate target C output</text><path d="M636 315 H762 M636 327 H762" class="wire"/><rect x="770" y="295" width="142" height="60" rx="5" class="box"/><text x="784" y="322">Peltier C</text><text x="42" y="405">D: RPWM 32 / LPWM 33</text><text x="42" y="428" class="small">R_EN 4 / L_EN 5</text><path d="M314 412 H403" class="signal"/><rect x="410" y="381" width="226" height="68" rx="5" class="box"/><text x="424" y="408">Driver 1</text><text x="424" y="431" class="small">Separate target D output</text><path d="M636 405 H762 M636 417 H762" class="wire"/><rect x="770" y="385" width="142" height="60" rx="5" class="box"/><text x="784" y="412">Peltier D</text><text x="24" y="525" class="small">Blue: PWM + enables. Paired dark lines: the two Peltier leads.</text><text x="24" y="550" class="small">Brown: external load-power pair to every driver, with suitable branch protection.</text><text x="24" y="574" class="small">ESP32 and driver logic share a ground reference. Match driver logic supply and input levels.</text><path d="M505 97 V111 M516 97 V111" class="power"/><text x="540" y="106" class="small">Load power</text><path d="M505 187 V201 M516 187 V201" class="power"/><text x="540" y="196" class="small">Load power</text><path d="M505 277 V291 M516 277 V291" class="power"/><text x="540" y="286" class="small">Load power</text><path d="M505 367 V381 M516 367 V381" class="power"/><text x="540" y="376" class="small">Load power</text></svg>
