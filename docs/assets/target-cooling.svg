<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="title"><title id="title">Peltier-plate mounting and lower airflow: proposed</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d83"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#27323b;font-size:16px}.small{font-size:13px;fill:#52616b}.head{font-size:20px;font-weight:600}.box{fill:#f4f7f9;stroke:#97a9b5;stroke-width:1.5}.signal{stroke:#285d83;stroke-width:2;fill:none;marker-end:url(#arrow)}.wire{stroke:#455764;stroke-width:2;fill:none}.power{stroke:#a35e2f;stroke-width:3;fill:none}.thermal{fill:#f7e6d8;stroke:#b87a4d}.cool{fill:#dceaf5;stroke:#5d8cae}</style><rect width="100%" height="100%" fill="#fff"/><text x="24" y="32" class="head">Peltier-plate mounting and lower airflow: proposed</text><text x="36" y="80">Warm background modules</text><text x="657" y="80">Warm background modules</text><rect x="24" y="99" width="304" height="30" class="thermal"/><rect x="600" y="99" width="316" height="30" class="thermal"/><rect x="24" y="129" width="304" height="55" fill="#cdd5db" stroke="#82929d"/><rect x="600" y="129" width="316" height="55" fill="#cdd5db" stroke="#82929d"/><text x="45" y="163">Machined aluminium carrier</text><text x="635" y="163">Machined aluminium carrier</text><rect x="367" y="99" width="193" height="28" class="cool"/><rect x="367" y="127" width="193" height="38" class="thermal"/><text x="403" y="119" class="small">Cold surface</text><text x="416" y="151" class="small">Peltier plate</text><rect x="367" y="166" width="193" height="8" fill="#ba774c"/><rect x="348" y="175" width="231" height="22" fill="#bbc6ce" stroke="#82929d"/><rect x="353" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="380" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="407" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="434" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="461" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="488" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="515" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="542" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><rect x="569" y="197" width="11" height="69" fill="#bbc6ce" stroke="#82929d"/><text x="631" y="221">Separate finned heat sink</text><path d="M620 216 H584" class="wire"/><path d="M328 99 H367 M560 99 H600" stroke="#8d997c" stroke-width="6"/><text x="280" y="64" class="small">Level, fly-tight perimeter with low thermal conduction</text><path d="M350 71 V92" class="wire"/><rect x="26" y="215" width="170" height="65" rx="5" class="box"/><text x="40" y="242">Fan below arena</text><path d="M196 248 H332 M600 248 H884" class="signal"/><text x="365" y="296" class="small">Air through the fins</text><text x="738" y="314" class="small">Warm air exits</text><text x="24" y="360" class="small">Heat flows down into the sink. Airflow stays below the walking surface.</text><text x="24" y="387" class="small">Not to scale. Mounting, clearances and heat-sink size require the actual CAD and thermal load.</text></svg>
