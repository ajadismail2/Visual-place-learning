site_name: Visual Place Learning
site_description: "A practical laboratory manual for building, wiring and operating a visual place-learning arena. Hardware, software, analysis and CAD."
site_author: Ajad Ismail
site_url: https://ajadismail2.github.io/Visual-place-learning/
repo_url: https://github.com/ajadismail2/Visual-place-learning
edit_uri: edit/main/docs/
theme:
  name: readthedocs
extra_css:
  - styles/readthedocs-extra.css
plugins:
  - search
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: false
      toc_depth: 2
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Home: index.md
  - HARDWARE:
      - Overview: hardware/overview.md
      - Equipment and materials: hardware/equipment-and-materials.md
      - Arena and dimensions: hardware/arena-and-dimensions.md
      - ESP32 and Arduino wiring: hardware/esp32-and-arduino-wiring.md
      - LED display: hardware/led-display.md
      - Peltier temperature system: hardware/peltier-temperature-system.md
      - Thermal ring: hardware/thermal-ring.md
      - Glass cover: hardware/glass-cover.md
      - Illumination: hardware/illumination.md
      - Cameras: hardware/cameras.md
  - SOFTWARE:
      - How the Codes work: software/how-the-programs-work.md
      - LED matrix library: software/led-matrix-library.md
      - Install and upload: software/install-and-upload.md
      - How to run an experiment: software/run-an-experiment.md
      - Checks and troubleshooting: software/checks-and-troubleshooting.md
      - 1. Primary ESP32; The Four-Peltier controller: software/four-peltier-controller.md
      - 2. Secondandry ESP32; The LED display controller: software/led-display-controller.md
      - 3. 60-Peltier background: software/60-peltier-background.md
      - 4. Thermal ring: software/thermal-ring.md
      - 5. Thermal camera stream: software/thermal-camera-stream.md
      - 6. Single-panel test: software/single-panel-test.md
  - ANALYSIS:
      - Analysis Workflow: analysis/ANALYSIS WORKFLOW.md
      - Tracking with AMADEUS: analysis/tracking-with-amadeus.md
      - The Analysis GUI: analysis/analysisgui.md
      - Current measurements and outputs: analysis/measurements-and-outputs.md
  - CAD:
      - Parts and STEP files: cad/parts-and-step-files.md
  - RESOURCES:
      - Downloads and references: resources/downloads-and-references.md
