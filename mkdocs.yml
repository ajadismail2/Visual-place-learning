site_name: Visual Place Learning
site_description: "Hardware methods for a visual place-learning apparatus: arena fabrication, thermal control, electronics, display geometry and firmware."
site_author: Ajad Ismail
site_url: https://ajadismail2.github.io/Visual-place-learning/
repo_url: https://github.com/ajadismail2/Visual-place-learning
edit_uri: edit/main/docs/
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: false
      toc_depth: 2
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Published specifications: build/published-specifications.md
  - Equipment and materials: build/equipment.md
  - Assembly:
      - Arena assembly: build/arena.md
      - PCB and wiring: build/pcb.md
      - Visual display geometry: build/visual-angle.md
  - Temperature control:
      - Background circuit: build/peltier.md
      - Four cooling targets: build/four-channels.md
      - Heat removal: build/thermal-coupling.md
  - Operating procedure: operation.md
  - Code:
      - Programs and setup: firmware/index.md
      - Master controller: firmware/master.md
      - 60-module background: firmware/background.md
      - LED display slave: firmware/display.md
      - Thermal ring: firmware/ring.md
      - Thermal camera stream: firmware/camera.md
      - Single-panel PCB test: firmware/panel-test.md
      - Four-Peltier bench controller: firmware/four-peltier.md
      - UART hot-output slave: firmware/hot-slave.md
  - Downloads and references: resources/sources.md
