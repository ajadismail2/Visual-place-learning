site_name: Visual Place Learning
site_description: "A practical laboratory manual for building, wiring and operating a visual place-learning arena. Hardware, software, analysis and CAD."
site_author: Ajad Ismail
site_url: https://ajadismail2.github.io/Visual-place-learning/
repo_url: https://github.com/ajadismail2/Visual-place-learning
edit_uri: edit/main/docs/
theme:
  name: readthedocs
extra_css:
  - styles/readthedocs-extra.css
plugins:
  - search
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: false
      toc_depth: 2
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Home: index.md
  - HARDWARE:
      - Overview: hardware/index.md
      - Equipment and materials: hardware/equipment.md
      - Arena and dimensions: hardware/arena.md
      - ESP32 and Arduino wiring: hardware/wiring.md
      - LED display: hardware/led-panels.md
      - Peltier temperature system: hardware/peltier.md
      - Thermal ring: hardware/ring.md
      - Glass cover: hardware/glass-cover.md
      - Illumination: hardware/illumination.md
      - Cameras: hardware/imaging.md
  - SOFTWARE:
      - How the programs work: software/index.md
      - Install and upload: software/upload.md
      - Run an experiment: software/operation.md
      - Checks and troubleshooting: software/checks.md
      - Four-Peltier controller: software/target-controller.md
      - 60-Peltier background: software/background.md
      - LED matrix library: software/led-library.md
      - LED display controller: software/display.md
      - Thermal ring: software/ring.md
      - Thermal camera stream: software/camera.md
      - Single-panel test: software/panel-test.md
  - ANALYSIS:
      - From video to measurements: analysis/index.md
      - Tracking with AMADEUS: analysis/tracking.md
      - Using the analysis GUI: analysis/gui.md
      - Measurements and outputs: analysis/measurements.md
  - CAD:
      - Parts and STEP files: cad/index.md
  - RESOURCES:
      - Downloads and references: resources/index.md
