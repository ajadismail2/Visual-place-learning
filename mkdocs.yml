site_name: Visual Place Learning
site_description: "A practical laboratory manual for building, wiring and operating a visual place-learning arena. Hardware, software, analysis and CAD."
site_author: Ajad Ismail
site_url: https://ajadismail2.github.io/Visual-place-learning/
repo_url: https://github.com/ajadismail2/Visual-place-learning
edit_uri: edit/main/docs/
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: false
      toc_depth: 2
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - HARDWARE:
      - Overview: index.md
      - Start with the hardware: hardware/index.md
      - Equipment and materials: build/equipment.md
      - Arena and dimensions: build/arena.md
      - ESP32 and Arduino wiring: build/wiring.md
      - Visual display geometry: build/visual-angle.md
      - Background circuit: build/peltier.md
      - Four cooling targets: build/four-channels.md
      - Thermal ring: hardware/ring.md
      - Heat removal: build/thermal-coupling.md
      - Cameras and illumination: hardware/imaging.md
  - SOFTWARE:
      - How the programs work: firmware/index.md
      - Install and upload: software/upload.md
      - Run an experiment: operation.md
      - Checks and troubleshooting: software/checks.md
      - Experiment controller: firmware/experiment.md
      - 60-module background: firmware/background.md
      - LED display controller: firmware/display.md
      - Thermal ring: firmware/ring.md
      - Thermal camera stream: firmware/camera.md
      - Single-panel test: firmware/panel-test.md
      - Four-Peltier bench controller: firmware/four-peltier.md
      - Downloads and references: resources/sources.md
  - ANALYSIS:
      - From video to measurements: analysis/index.md
      - Tracking with AMADEUS: analysis/tracking.md
      - Using the analysis GUI: analysis/gui.md
      - Measurements and outputs: analysis/measurements.md
  - CAD:
      - Parts and STEP files: cad/index.md
