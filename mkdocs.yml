site_name: Visual Place Learning
site_description: "Makerspace construction notes for a visual place-learning replication: arena fabrication, Peltier control, PCB connections, and display geometry."
site_author: Ajad Ismail
site_url: https://ajadismail2.github.io/Visual-place-learning/
repo_url: https://github.com/ajadismail2/Visual-place-learning
edit_uri: edit/main/docs/
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true
      toc_depth: 2
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Build overview: index.md
  - Making the arena: build/arena.md
  - Why Peltier modules: build/peltier.md
  - PCB and connections: build/pcb.md
  - Four separate channels: build/four-channels.md
  - Setting the visual angle: build/visual-angle.md
  - Where the heat goes: build/thermal-coupling.md
  - Sources and revisions: resources/sources.md
